<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LM Studio Web Client</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #output { margin-top: 20px; padding: 15px; background: #000000; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>LM Studio Local AI Client</h2>
  <textarea id="userInput" placeholder="Ask your local model something..."></textarea>
  <button onclick="sendPrompt()">Send</button>

  <div id="output">Response will appear here...</div>

  <script src="script.js"></script>
</body>
</html>
