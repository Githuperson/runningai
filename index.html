<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-6">
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700">
      <h1 class="text-xl font-semibold text-white flex items-center gap-2">
        <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
        LM Studio Local AI
      </h1>
      <span class="text-xs font-mono bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">localhost:1234</span>
    </div>

    <div class="space-y-4">
      <div>
        <label for="userInput" class="block text-sm font-medium text-slate-300 mb-2">Your Prompt</label>
        <textarea 
          id="userInput" 
          rows="4" 
          placeholder="Ask your local model anything..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition resize-none"></textarea>
      </div>

      <button 
        onclick="sendPrompt()" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg shadow transition duration-150 ease-in-out active:scale-[0.99] flex justify-center items-center gap-2">
        <span>Send Request</span>
      </button>
    </div>

    <div class="mt-6">
      <h2 class="text-sm font-medium text-slate-400 mb-2">Output</h2>
      <div 
        id="output" 
        class="min-h-[120px] max-h-[400px] overflow-y-auto bg-slate-900 border border-slate-700/60 rounded-lg p-4 text-slate-300 text-sm leading-relaxed whitespace-pre-wrap font-sans">
        Response will appear here...
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
